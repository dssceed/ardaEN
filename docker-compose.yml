services:
  db:
    image: mysql:8.0
    container_name: arda_db
    ports:
      - "3306:3306" # ยิง Port ออกมาข้างนอกเพื่อให้ Prisma (ใน WSL) เข้าถึงได้
    environment:
      MYSQL_ROOT_PASSWORD: arda_root_password
      MYSQL_DATABASE: arda_en
      MYSQL_USER: arda_user
      MYSQL_PASSWORD: arda_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ${PWD}/db/arda_04.sql:/docker-entrypoint-initdb.d/arda_04.sql

  app:
    image: oven/bun:alpine # ใช้ image สำเร็จรูปเลย ไม่ต้อง build เอง
    container_name: arda_en
    volumes:
      - .:/app # Mount โค้ดจากเครื่องเราเข้าไป (เหมือน -v ${PWD}:/app)
    working_dir: /app
    ports:
      - "3000:3000"
    command: sh -c "bun install && bun run build && bun run start -- -H 0.0.0.0"
    depends_on:
      - db
    environment:
      NODE_ENV: production
      DATABASE_URL: "mysql://root:arda_root_password@db:3306/arda_en"
      DATABASE_HOST: "db"
      DATABASE_USER: "root"
      DATABASE_PASSWORD: "arda_root_password"
      DATABASE_NAME: "arda_en"
      DATABASE_PORT: "3306"

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: arda_tunnel
    command: tunnel --url http://app:3000
    restart: always
    depends_on:
      - app

volumes:
  mysql_data:
